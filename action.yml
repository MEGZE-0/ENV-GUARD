name: "ComposeEnvGuard"
description: "Check Docker Compose environment configuration and publish a report to the job summary."
author: "ComposeEnvGuard contributors"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  path:
    description: "Project directory to scan, relative to the repository root."
    required: false
    default: "."
  env-example:
    description: "Environment template relative to the project directory. Defaults to .env.example, then .env.sample."
    required: false
    default: ""
  compose-files:
    description: "Optional Compose files relative to the project directory, one per line. Omit to use the default file name."
    required: false
    default: ""
  fail-on:
    description: "Severity that fails the step: error (default), warning, info, or never."
    required: false
    default: "error"
  python-version:
    description: "Python version installed by the action when setup-python is true (3.11 or newer)."
    required: false
    default: "3.12"
  setup-python:
    description: "Set to 'false' when an earlier workflow step already provides Python 3.11+ on PATH."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      if: ${{ inputs.setup-python == 'true' }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Run ComposeEnvGuard
      shell: bash
      env:
        CEG_ACTION_PATH: ${{ github.action_path }}
        CEG_PATH: ${{ inputs.path }}
        CEG_ENV_EXAMPLE: ${{ inputs.env-example }}
        CEG_COMPOSE_FILES: ${{ inputs.compose-files }}
        CEG_FAIL_ON: ${{ inputs.fail-on }}
        CEG_PYTHON: python
      run: bash "$CEG_ACTION_PATH/scripts/ci-scan.sh"
