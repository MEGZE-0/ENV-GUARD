name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and CLI smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest with coverage
        run: pytest --cov=compose_env_guard --cov-report=term-missing --cov-report=xml

      - name: CLI smoke test
        run: |
          composeguard version
          composeguard rules > /dev/null
          composeguard scan examples/healthy-project
          set +e
          composeguard scan examples/broken-project --format json --output broken-report.json
          code=$?
          set -e
          test "$code" -eq 1
          python -c "import json; r=json.load(open('broken-report.json')); assert r['status']=='failed'"

  package:
    name: Build and verify distribution artifacts
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist/

      - name: Install the wheel into a clean virtual environment and check the CLI
        run: |
          python -m venv "$RUNNER_TEMP/clean-venv"
          "$RUNNER_TEMP/clean-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/clean-venv/bin/composeguard" version
          "$RUNNER_TEMP/clean-venv/bin/composeguard" scan examples/healthy-project --format markdown

  docker:
    name: Docker image, CLI and Compose API smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Docker tests (run here because this job has a Docker daemon)
        run: pytest tests/test_docker.py -v -rs

      - name: Docker smoke test, part 1 (image build, non-root user, CLI exit codes)
        run: bash scripts/docker-smoke.sh cli

      - name: Docker smoke test, part 2 (Compose stack, /health, /docs, /api/v1/scan, port binding)
        run: bash scripts/docker-smoke.sh api

      - name: Show Compose state on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true

  composite-action:
    name: Composite action smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run this repository's action against the healthy example
        uses: ./
        with:
          path: examples/healthy-project
          fail-on: error
