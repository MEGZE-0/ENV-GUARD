[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compose-env-guard"
dynamic = ["version"]
description = "Catch Docker Compose environment configuration mistakes before they break your deployment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "MEGZE-0", email = "167402802+MEGZE-0@users.noreply.github.com" },
    { name = "ComposeEnvGuard contributors" },
]
maintainers = [
    { name = "MEGZE-0", email = "167402802+MEGZE-0@users.noreply.github.com" },
]
keywords = ["docker", "docker-compose", "devops", "configuration", "environment-variables", "github-actions", "cli", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "compose-env-guard[api]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
    "build>=1.2",
]

[project.scripts]
composeguard = "compose_env_guard.cli:main"

[project.urls]
Homepage = "https://github.com/MEGZE-0/ENV-GUARD"
Issues = "https://github.com/MEGZE-0/ENV-GUARD/issues"
Documentation = "https://github.com/MEGZE-0/ENV-GUARD/tree/main/docs"

[tool.setuptools.dynamic]
version = { attr = "compose_env_guard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compose_env_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = ["docker: requires a working Docker daemon"]

[tool.coverage.run]
source = ["compose_env_guard"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
